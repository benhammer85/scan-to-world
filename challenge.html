<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f4efe4" />
    <meta name="apple-mobile-web-app-title" content="Well Rounded" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/src/rings/icon/icon-180.png" />
    <link rel="icon" type="image/png" href="/src/rings/icon/icon-180.png" />
    <title>Well Rounded: Challenge</title>
    <style>
      body { position: fixed; inset: 0; }
      html, body { margin: 0; height: 100%; background: #f4efe4; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
      #press { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; }
      #words { position: fixed; top: calc(70px + env(safe-area-inset-top)); left: 24px; right: 24px; text-align: center; font: italic 15px "Newsreader", "Iowan Old Style", Georgia, serif; color: #2e2118; opacity: 0; transition: opacity 2s; pointer-events: none; text-wrap: balance; }
      #words.shown { opacity: 0.5; }
      #nav { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font: italic 15px "Newsreader", "Iowan Old Style", Georgia, serif; color: #2e2118; opacity: 0.5; transition: opacity 0.8s; pointer-events: none; }
      #nav a, #nav span { pointer-events: auto; color: inherit; text-decoration: none; padding: 12px 10px; display: inline-block; }
      #nav span { opacity: 0.55; }
      #nav.away { opacity: 0; }
      #nav.away a { pointer-events: none; }
      #score { position: fixed; top: calc(24px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font: 15px "Newsreader", "Iowan Old Style", Georgia, serif; letter-spacing: 0.06em; color: #2e2118; opacity: 0.55; pointer-events: none; font-variant-numeric: tabular-nums; }
      #words.over { opacity: 0.75; }
      #runs { position: fixed; inset: 0; z-index: 20; display: none; overflow-y: auto; background: #f4efe4; padding: calc(20px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom)); box-sizing: border-box; touch-action: pan-y; font-family: "Newsreader", "Iowan Old Style", Georgia, serif; color: #2e2118; }
      #runs.open { display: block; }
      #runs header { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 4px 22px; }
      #runs h1 { font-weight: 400; font-style: italic; font-size: 22px; margin: 0; letter-spacing: 0.02em; }
      #runs .close { font-style: italic; font-size: 15px; font-family: inherit; color: inherit; opacity: 0.6; background: none; border: 0; padding: 12px 4px; cursor: pointer; }
      #runs .none { font-style: italic; opacity: 0.55; text-align: center; margin-top: 30vh; }
      #runs .none[hidden] { display: none; }
      #runs .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 22px 16px; }
      #runs .card { display: grid; justify-items: center; gap: 4px; background: none; border: 0; padding: 0; color: inherit; font-family: inherit; cursor: pointer; }
      #runs .card img, #runs .big img { width: 100%; aspect-ratio: 1; display: block; border-radius: 2px; }
      #runs .card b { font-weight: 400; font-size: 20px; font-variant-numeric: tabular-nums; margin-top: 2px; }
      #runs .card small { font-style: italic; font-size: 12.5px; opacity: 0.55; }
      #runs .big { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: #f4efe4; padding: 24px; cursor: pointer; }
      #runs .big.open { display: flex; }
      #runs .big img { max-width: min(92vw, 560px); }
      #runs .big b { font-weight: 400; font-size: 24px; }
      #runs .big small { font-style: italic; opacity: 0.6; }

    </style>
  </head>
  <body data-mode="challenge">
    <canvas id="press" aria-label="Well Rounded, the challenge: ten rings, each as close to the last as you dare, and quickly; touching the edge costs points"></canvas>
    <p id="score"></p>
    <p id="words"></p>
    <nav id="nav"><a href="./" data-page="practice">practice</a> · <a href="./child.html" data-page="child">child</a> · <span aria-current="page">challenge</span> · <a href="./puzzle.html" data-page="puzzle">puzzle</a> · <a href="#runs" id="open-runs">runs</a></nav>
    <section id="runs" aria-label="Your runs">
      <header><h1>Your runs</h1><button class="close" aria-label="Close">close</button></header>
      <p class="none">Your finished runs will be kept here, each with its slice.</p>
      <div class="grid"></div>
      <div class="big" role="dialog" aria-label="A run"><img alt="" /><b></b><small></small></div>
    </section>
    <script type="module" src="/src/rings/press.ts"></script>
  </body>
</html>
