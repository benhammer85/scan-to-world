<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f7f3eb" />
    <meta name="apple-mobile-web-app-title" content="Well Rounded" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/src/rings/icon/icon-180.png" />
    <link rel="icon" type="image/png" href="/src/rings/icon/icon-64.png" />
    <link rel="manifest" href="well-rounded.webmanifest" />
    <title>Well Rounded</title>
    <style>
      body { position: fixed; inset: 0; }
      html, body { margin: 0; height: 100%; background: #f7f3eb; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
      #press { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; }
      #words { position: fixed; top: calc(70px + env(safe-area-inset-top)); left: 24px; right: 24px; text-align: center; font: italic 15px "Newsreader", "Iowan Old Style", Georgia, serif; color: rgba(46,33,24,0.64); opacity: 0; transition: opacity 2s; pointer-events: none; text-wrap: balance; }
      #words.shown { opacity: 1; }
      #words.swap { transition: opacity 0.4s; }
      /* (Never over the print: withheld while the slice lies under them; on the map, a clearing of paper.) */
      #words.covered { opacity: 0; transition: opacity 0.3s; }
      #words.onmap { padding: 14px 20px; margin: -14px auto 0; max-width: 340px; background: radial-gradient(closest-side, rgba(247, 243, 235,0.96) 70%, rgba(247, 243, 235,0)); }
      .sr { position: fixed; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      button.pencil { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; border-radius: 8px; }
      button.pencil:focus-visible { outline: 1.5px solid rgba(46,33,24,0.6); outline-offset: 2px; }
      #nav { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font: italic 15px "Newsreader", "Iowan Old Style", Georgia, serif; color: #2e2118; opacity: 0.5; transition: opacity 0.8s; pointer-events: none; }
      #nav a, #nav span { pointer-events: auto; color: inherit; text-decoration: none; padding: 12px 10px; display: inline-block; }
      #nav span { opacity: 0.55; }
      #nav.away { opacity: 0; }
      #nav.away a { pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="press" role="img" aria-label="Well Rounded: a tree slice. Draw one loop around it each day; in a year it stands in your grove. Pinch out to see the grove."></canvas>
    <p id="words" role="status" aria-live="polite"></p>
    <p id="heard" class="sr" aria-live="polite"></p>
    <script type="module" src="/src/rings/press.ts"></script>
  </body>
</html>
