<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Scan-to-World</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage"></div>

    <aside id="panel" hidden>
      <header>
        <h1>Scan-to-World</h1>
        <button id="panel-toggle" aria-label="Close drawer">×</button>
      </header>

      <div class="panel-body">
        <section>
          <h2>Object</h2>
          <label class="file">
            <input id="file" type="file" accept=".glb,.gltf,.obj,.ply" />
            <span>Load scan (GLB / OBJ / PLY)</span>
          </label>
          <button id="demo">Use demo orange</button>
          <div class="row">
            <label for="target-tris">Decimate to</label>
            <input id="target-tris" type="number" value="15000" min="1000" step="1000" />
            <button id="decimate">Go</button>
          </div>
          <p id="stats" class="muted"></p>
        </section>

        <section>
          <h2>Terrain</h2>
          <div class="row">
            <label for="height-mode">Height from</label>
            <select id="height-mode">
              <option value="radial">Radial (round objects)</option>
              <option value="curvature">Curvature (general)</option>
            </select>
          </div>
          <div class="row">
            <label for="smoothing">Smoothing</label>
            <input id="smoothing" type="range" min="0" max="20" value="2" />
          </div>
          <div class="row">
            <label for="bands">Contours</label>
            <input id="bands" type="range" min="4" max="60" value="22" />
          </div>
          <div class="row">
            <label for="surface">Surface</label>
            <select id="surface">
              <option value="scan">Scan colours</option>
              <option value="paper">Paper</option>
              <option value="elevation">Elevation tint</option>
            </select>
          </div>
          <div class="row">
            <label for="pace">Pen pace</label>
            <input id="pace" type="range" min="0.5" max="4" step="0.25" value="1" />
          </div>
          <button id="replay">Replay plot</button>
        </section>

        <section>
          <h2>Ground</h2>
          <div class="row">
            <label for="displace">Move surface</label>
            <input id="displace" type="checkbox" checked />
          </div>
          <button id="reset-edits">Reset edits</button>
          <p class="muted hint">Tuning drawer. Toggle with three fingers held, or the ` key.</p>
        </section>
      </div>
    </aside>

    <p id="hint">tap for people · drag to turn the days · hold to press in · hold and pull to raise · pinch to come closer</p>
    <div id="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
